name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        include:
          - image: latest
            version: 29-cli
          - image: 20-cli
            version: 20-cli
          - image: 23-cli
            version: 23-cli
          - image: 24-cli
            version: 24-cli
          - image: 27-cli
            version: 27-cli
          - image: 28-cli
            version: 28-cli
          - image: 29-cli
            version: 29-cli

      fail-fast: false

    name: "Test (dockette/docker:${{ matrix.image }})"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Build image"
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dockette/docker:${{ matrix.image }}
          build-args: |
            VERSION=${{ matrix.version }}

      - name: "Test image"
        run: make test TAG=${{ matrix.image }}

  build:
    runs-on: "ubuntu-latest"
    needs: ["test"]
    strategy:
      matrix:
        include:
          - image: latest
            version: 29-cli
          - image: 20-cli
            version: 20-cli
          - image: 23-cli
            version: 23-cli
          - image: 24-cli
            version: 24-cli
          - image: 27-cli
            version: 27-cli
          - image: 28-cli
            version: 28-cli
          - image: 29-cli
            version: 29-cli

      fail-fast: false

    name: "Build (dockette/docker:${{ matrix.image }})"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Login to DockerHub"
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Cache Docker layers"
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}-${{ matrix.image }}

      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: dockette/docker:${{ matrix.image }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ matrix.version }}

  docs:
    name: "Docs"
    runs-on: "ubuntu-latest"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Update Docker Hub description"
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: "dockette/docker"
